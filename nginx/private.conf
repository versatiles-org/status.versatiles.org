# Shared by every location under /private/ (see nginx.conf), so a new area
# can't miss any of it: the login, the headers, and the bar at the top of
# every page. Each location sets $private_section first, which marks its link
# in the bar (home, dashboard or dependencies).

# nginx asks the login service about every request (auth_request); without a
# valid session the visitor is sent to the login page.
auth_request /_auth;
error_page 401 = @login;

# A location with its own add_header drops the server's, so HSTS is repeated.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cache-Control "private, no-store" always;
add_header X-Frame-Options "DENY" always;

# The bar, the same on every page whatever generated it: nginx inserts it
# right after <body> in every HTML page. It is styled by private/bar.css, and
# the pages keep their own navigation below it. tests/private.sh checks that
# every area gets it. The links carry target="_self", which changes nothing
# in the browser but keeps client-side routers like VitePress' from taking
# them over and loading the other areas as pages of their own.
sub_filter_once on;
sub_filter '<body>' '<body><link rel="stylesheet" href="/private/bar.css"><div class="vt-bar" role="navigation" aria-label="Maintainer area" data-section="$private_section"><div class="vt-links"><a class="vt-home" data-for="home" href="/private/" target="_self"><img src="https://versatiles.org/assets/logo/versatiles.svg" alt=""><span>Maintainer area</span></a><a data-for="dashboard" href="/private/dashboard/" target="_self">Dashboard</a><a data-for="dependencies" href="/private/dependency-status/" target="_self">Dependencies</a><a href="/" target="_self">Status page</a></div><form method="post" action="/logout"><button type="submit">Log out</button></form></div>';
