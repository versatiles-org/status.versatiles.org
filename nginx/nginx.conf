# The nginx configuration, reached through nginx.stub.conf. A plain
# `nginx -s reload` (bin/update.sh) applies changes to it.
#
# No templates and no environment variables: the certificate lives under a
# fixed name in /etc/nginx/ssl (see bin/cert), so the domain never appears here.

worker_processes auto;

# Without a limit, one idle keep-alive connection holds a container stop until
# Docker kills it. See compose.yaml's stop_grace_period.
worker_shutdown_timeout 1s;

pid /run/nginx.pid;

events {
   worker_connections 1024;
}

http {
   server_tokens off;

   sendfile on;
   tcp_nodelay on;
   keepalive_timeout 30;

   include /etc/nginx/mime.types;
   default_type application/octet-stream;

   # No access log: the page has no use for one, and it would hold addresses.
   access_log off;

   # Docker's DNS. Resolving gatus per request (through the variable in
   # proxy_pass) follows the container when it is recreated with a new address.
   resolver 127.0.0.11 valid=10s ipv6=off;

   # The dashboard polls the API every few seconds per open tab.
   limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
   # Logins: each one costs the login service 128 MiB of scrypt, and this is
   # what makes guessing passwords slow.
   limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
   limit_req_status 429;

   server {
      listen 80 default_server;
      listen [::]:80 default_server;

      # certbot's HTTP-01 challenge, see bin/cert.
      location /.well-known/acme-challenge/ {
         root /var/www/certbot;
      }

      # Container healthcheck. Answered by nginx alone.
      location = /healthz {
         default_type text/plain;
         return 200 "ok\n";
      }

      location / {
         return 301 https://$host$request_uri;
      }
   }

   server {
      listen 443 ssl default_server;
      listen [::]:443 ssl default_server;
      http2 on;

      ssl_certificate /etc/nginx/ssl/fullchain.pem;
      ssl_certificate_key /etc/nginx/ssl/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_cache shared:SSL:1m;
      ssl_session_timeout 1h;

      add_header Strict-Transport-Security "max-age=31536000" always;

      # The private area: static pages from ./private. nginx asks the login
      # service about every request (auth_request); without a valid session the
      # visitor is sent to the login page.
      location /private/ {
         auth_request /_auth;
         error_page 401 = @login;
         alias /var/www/private/;
         # A location with its own add_header drops the server's, so HSTS is repeated.
         add_header Strict-Transport-Security "max-age=31536000" always;
         add_header Cache-Control "private, no-store" always;
         add_header X-Frame-Options "DENY" always;
      }

      location = /private {
         return 301 /private/;
      }

      location = /_auth {
         internal;
         set $login_auth http://login:8080/auth;
         proxy_pass $login_auth;
         proxy_pass_request_body off;
         proxy_set_header Content-Length "";
      }

      location @login {
         return 302 /login?next=$uri;
      }

      location = /login {
         limit_req zone=login burst=10 nodelay;
         set $login_page http://login:8080/login$is_args$args;
         proxy_pass $login_page;
         proxy_set_header Host $host;
      }

      location = /logout {
         set $login_logout http://login:8080/logout;
         proxy_pass $login_logout;
         proxy_set_header Host $host;
      }

      # Everything else is Gatus and the public status page.
      location / {
         limit_req zone=api burst=50 nodelay;

         set $gatus http://gatus:8080;
         proxy_pass $gatus;
         proxy_http_version 1.1;
         proxy_set_header Host $host;
         proxy_set_header X-Forwarded-Proto https;
      }
   }
}
