# The nginx configuration, reached through nginx.stub.conf. A plain
# `nginx -s reload` (bin/update.sh) applies changes to it.
#
# No templates and no environment variables: the certificate lives under a
# fixed name in /etc/nginx/ssl (see bin/cert), so the domain never appears here.

worker_processes auto;

# Without a limit, one idle keep-alive connection holds a container stop until
# Docker kills it. See compose.yaml's stop_grace_period.
worker_shutdown_timeout 1s;

pid /run/nginx.pid;

events {
   worker_connections 1024;
}

http {
   server_tokens off;

   sendfile on;
   tcp_nodelay on;
   keepalive_timeout 30;

   include /etc/nginx/mime.types;
   default_type application/octet-stream;

   # No access log: the page has no use for one, and it would hold addresses.
   access_log off;

   # Docker's DNS. Resolving gatus per request (through the variable in
   # proxy_pass) follows the container when it is recreated with a new address.
   resolver 127.0.0.11 valid=10s ipv6=off;

   # The dashboard polls the API every few seconds per open tab.
   limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
   limit_req_status 429;

   server {
      listen 80 default_server;
      listen [::]:80 default_server;

      # certbot's HTTP-01 challenge, see bin/cert.
      location /.well-known/acme-challenge/ {
         root /var/www/certbot;
      }

      # Container healthcheck. Answered by nginx alone.
      location = /healthz {
         default_type text/plain;
         return 200 "ok\n";
      }

      location / {
         return 301 https://$host$request_uri;
      }
   }

   server {
      listen 443 ssl default_server;
      listen [::]:443 ssl default_server;
      http2 on;

      ssl_certificate /etc/nginx/ssl/fullchain.pem;
      ssl_certificate_key /etc/nginx/ssl/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_cache shared:SSL:1m;
      ssl_session_timeout 1h;

      add_header Strict-Transport-Security "max-age=31536000" always;

      location / {
         limit_req zone=api burst=50 nodelay;

         set $gatus http://gatus:8080;
         proxy_pass $gatus;
         proxy_http_version 1.1;
         proxy_set_header Host $host;
         proxy_set_header X-Forwarded-Proto https;
      }
   }
}
