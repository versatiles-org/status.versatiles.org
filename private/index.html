<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Maintainer area · VersaTiles Status</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				padding: 32px 16px;
				background: #1b1b1f;
				color: #ccc;
				font: 16px/1.5 system-ui, sans-serif;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
			}
			header img {
				width: 40px;
				height: 40px;
			}
			h1 {
				flex: 1;
				margin: 0;
				font-size: 24px;
				color: #fff;
			}
			button {
				padding: 6px 14px;
				font: inherit;
				font-size: 14px;
				color: #ccc;
				background: transparent;
				border: 1px solid #36363c;
				border-radius: 6px;
				cursor: pointer;
			}
			a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<img src="https://versatiles.org/assets/logo/versatiles.svg" alt="" />
				<h1>Maintainer area</h1>
				<form method="post" action="/logout"><button type="submit">Log out</button></form>
			</header>
			<p>Nothing here yet. Pages for maintainers will follow.</p>
			<p><a href="/">Public status page</a></p>
		</main>
	</body>
</html>
