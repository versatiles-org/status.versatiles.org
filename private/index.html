<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" type="image/png" sizes="32x32" href="https://versatiles.org/assets/logo/versatiles.32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="https://versatiles.org/assets/logo/versatiles.16.png" />
		<link rel="shortcut icon" href="https://versatiles.org/assets/logo/favicon.ico" />
		<link rel="apple-touch-icon" href="https://versatiles.org/assets/logo/versatiles.512.png" />
		<title>Maintainer area · VersaTiles Status</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				background: #1b1b1f;
				color: #ccc;
				font: 16px/1.5 system-ui, sans-serif;
			}
			/* No padding on body: the bar nginx adds at the top spans the page. */
			main {
				max-width: 720px;
				margin: 0 auto;
				padding: 32px 16px;
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
			}
			header img {
				width: 40px;
				height: 40px;
			}
			h1 {
				flex: 1;
				margin: 0;
				font-size: 24px;
				color: #fff;
			}
			a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<img src="https://versatiles.org/assets/logo/versatiles.svg" alt="" />
				<h1>Maintainer area</h1>
			</header>
			<ul>
				<li><a href="/private/dashboard/">Dashboard</a>: what's urgent, what's important, and the state of every repo.</li>
				<li><a href="/private/dependency-status/">Dependency status</a>: outdated dependencies in the order to update them, pinned versions, deployments, and what is open and unreleased in every repo.</li>
				<li><a href="/">Public status page</a></li>
			</ul>
		</main>
	</body>
</html>
