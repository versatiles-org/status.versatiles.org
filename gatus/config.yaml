# Gatus configuration for status.versatiles.org.
#
# The reference is the Gatus README for the pinned version (see compose.yaml):
# https://github.com/TwiN/gatus/blob/v5.38.0/README.md
#
# Gatus watches this file and reloads it when `git pull` changes it, so a
# change here needs no restart. tests/config.sh checks that Gatus accepts it.
#
# ${...} values come from .env through compose.yaml. A literal `$` must be
# written as `$$`.

# The start page. Gatus has no layout options: only these texts, links and
# buttons, and custom CSS.
ui:
  title: VersaTiles Status
  description: Current state and uptime of the public VersaTiles services.
  header: VersaTiles Status
  dashboard-heading: VersaTiles services
  dashboard-subheading: Live checks of map tiles, downloads, geocoding, the websites and DNS. Most run every minute. Click a check for its history.
  logo: https://versatiles.org/assets/logo/versatiles.svg
  link: https://versatiles.org
  favicon:
    default: https://versatiles.org/assets/logo/favicon.ico
    size32x32: https://versatiles.org/assets/logo/versatiles.32.png
  default-sort-by: group
  buttons:
    - name: Map
      link: https://tiles.versatiles.org/
    - name: Download
      link: https://download.versatiles.org/
    - name: Docs
      link: https://docs.versatiles.org/
    - name: versatiles.org
      link: https://versatiles.org/
    - name: GitHub
      link: https://github.com/versatiles-org
  # The colours of versatiles.org for the dark theme, which Gatus shows by
  # default: its background and text, and the purple of the logo as accent.
  # Only Gatus' theme variables (HSL values, as in its own app.css) are
  # changed, not its markup, so this should survive Gatus updates. Gatus sets
  # them on `:root.dark`, and custom.css loads before app.css, so the selector
  # here must be more specific: `html:root.dark`. The light theme stays Gatus'
  # own.
  #
  # The last rule hides "System Monitoring Dashboard" under the header, which
  # Gatus hardcodes. If a Gatus update changes the markup, it simply shows again.
  custom-css: |
    html:root.dark {
      --background: 240 7% 11%;
      --card: 240 7% 14%;
      --popover: 240 7% 14%;
      --foreground: 0 0% 80%;
      --card-foreground: 0 0% 80%;
      --popover-foreground: 0 0% 80%;
      --muted: 240 6% 20%;
      --muted-foreground: 0 0% 60%;
      --secondary: 240 6% 20%;
      --accent: 240 6% 20%;
      --border: 240 6% 22%;
      --input: 240 6% 22%;
      --ring: 271 100% 60%;
    }
    header h1.text-2xl + p.text-muted-foreground {
      display: none;
    }

storage:
  type: sqlite
  path: /data/data.db
  caching: true

# If a pulled config is invalid, keep running the old one instead of exiting.
# CI runs tests/config.sh on every push, and bin/update.sh restarts Gatus after
# a config change and checks that it loaded every endpoint.
skip-invalid-config-update: true

# Alerts go to the maintainer's phone through Pushover. They are for outages
# and for things that go stale unnoticed, like an old planet. Failing CI or
# security alerts don't belong here.
#
# Three failed checks in a row (about three minutes) before an alert, so a
# deploy or a single lost request doesn't wake anyone. Planned work at fixed
# times goes in `maintenance-windows` on the endpoints it affects.
#
# Gatus doesn't group alerts: every failing check with `alerts` sends its own
# message, so one server going down would send one per check. Therefore only
# the checks that matter most for a service alert, the ones users depend on
# directly, plus checks nothing else would notice (certificates, DNS, domains).
# The other checks show on the page and stay silent.
#
# Without the two keys in .env, Gatus ignores the alerts and only shows the
# page, which is what tests/config.sh and local runs rely on.
alerting:
  pushover:
    application-token: ${PUSHOVER_APPLICATION_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    resolved-priority: -1
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  # tiles.versatiles.org. Alerts: the tile and the style, which maps load.

  - name: Vector tile
    group: Tiles
    url: https://tiles.versatiles.org/tiles/osm/5/17/10
    conditions:
      - "[STATUS] == 200"
      # A real tile of central Europe is about 120 kB. An empty or error body is not.
      - "len([BODY]) > 10000"
      - "[RESPONSE_TIME] < 3000"
      # certbot renews 30 days before expiry, so 14 days left means renewal is broken.
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts: &alerts
      - type: pushover

  - name: Map style
    group: Tiles
    url: https://tiles.versatiles.org/assets/styles/colorful/style.json
    conditions:
      - "[STATUS] == 200"
      - "[BODY].version == 8"
      - "len([BODY].layers) > 100"
    alerts: *alerts

  - name: Map frontend
    group: Tiles
    url: https://tiles.versatiles.org/
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<title>VersaTiles*)"
      - "[RESPONSE_TIME] < 3000"

  - name: Tile metadata
    group: Tiles
    url: https://tiles.versatiles.org/tiles/osm/meta.json
    conditions:
      - "[STATUS] == 200"
      - "[BODY].name == VersaTiles OSM"
      - "[BODY].maxzoom == 14"

  - name: Deployed versions
    group: Tiles
    url: https://tiles.versatiles.org/version.json
    conditions:
      - "[STATUS] == 200"
      - "has([BODY].versatiles) == true"

  # Satellite imagery comes from two places: zoom 0-16 from the tile server's
  # local copy, zoom 17 and up from the CDN (see download/sources.json in
  # tiles.versatiles.org). Each path gets its own alerting check.

  - name: Satellite tile, zoom 5 (local copy)
    group: Satellite
    url: https://tiles.versatiles.org/tiles/satellite/5/17/10
    conditions:
      - "[STATUS] == 200"
      # About 60 kB.
      - "len([BODY]) > 10000"
      - "[RESPONSE_TIME] < 3000"
    alerts: *alerts

  - name: Satellite tile, zoom 17 (from the CDN)
    group: Satellite
    # Berlin, where orthophotos exist at this zoom.
    url: https://tiles.versatiles.org/tiles/satellite/17/70420/42986
    conditions:
      - "[STATUS] == 200"
      # About 20 kB.
      - "len([BODY]) > 5000"
      - "[RESPONSE_TIME] < 5000"
    alerts: *alerts

  - name: Satellite metadata
    group: Satellite
    url: https://tiles.versatiles.org/tiles/satellite/meta.json
    conditions:
      - "[STATUS] == 200"
      - "[BODY].tile_format == image/webp"
      - "[BODY].maxzoom == 19"

  # download.versatiles.org and the CDN behind it. Alerts: the page (the
  # Cloudflare Worker) and the CDN (the bucket). The planet file goes through
  # both, so it stays silent.

  - name: Download page
    group: Download
    url: https://download.versatiles.org/
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*osm-vector.versatiles*)"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts: *alerts

  # HEAD only: the file is about 66 GB.
  - name: Planet file
    group: Download
    url: https://download.versatiles.org/osm-vector/osm-vector.versatiles
    method: HEAD
    interval: 10m
    conditions:
      - "[STATUS] == 200"

  - name: CDN
    group: Download
    url: https://cdn.versatiles.cloud/osm-vector/osm-vector.versatiles
    method: HEAD
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts: *alerts

  # geocode.versatiles.org

  - name: Geocoding
    group: Geocoding
    url: https://geocode.versatiles.org/api?q=berlin&limit=1
    conditions:
      - "[STATUS] == 200"
      - "[BODY].features[0].properties.name == Berlin"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts: *alerts

  # Websites

  - name: versatiles.org
    group: Websites
    url: https://versatiles.org/
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<title>VersaTiles*)"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts: *alerts

  - name: docs.versatiles.org
    group: Websites
    url: https://docs.versatiles.org/
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<title>VersaTiles*)"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts: *alerts

  # DNS and domains. The A records name the servers on purpose: a changed
  # record is either a planned move, which updates this file, or a problem.

  - name: tiles.versatiles.org A record
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: tiles.versatiles.org
      query-type: A
    interval: 5m
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 194.150.168.103"
    alerts: *alerts

  - name: geocode.versatiles.org A record
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: geocode.versatiles.org
      query-type: A
    interval: 5m
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 138.199.238.207"
    alerts: *alerts

  # download.versatiles.org crosses two DNS providers: the CNAME is in the
  # versatiles.org zone at checkdomain, its target at Cloudflare.
  - name: download.versatiles.org CNAME
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: download.versatiles.org
      query-type: CNAME
    interval: 5m
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == download.versatiles.cloud."
    alerts: *alerts

  - name: docs.versatiles.org CNAME
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: docs.versatiles.org
      query-type: CNAME
    interval: 5m
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == versatiles-org.github.io."
    alerts: *alerts

  # Gatus returns one of the name servers, not always the same, hence patterns.
  - name: versatiles.org name servers
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: versatiles.org
      query-type: NS
    interval: 5m
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == pat(*.checkdomain.de.)"
    alerts: *alerts

  - name: versatiles.cloud name servers
    group: DNS
    url: 1.1.1.1
    dns:
      query-name: versatiles.cloud
      query-type: NS
    interval: 5m
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == pat(*.ns.cloudflare.com.)"
    alerts: *alerts

  - name: versatiles.org domain
    group: DNS
    url: https://versatiles.org/
    interval: 12h
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
    alerts: *alerts

  - name: versatiles.cloud domain
    group: DNS
    url: https://versatiles.cloud/
    interval: 12h
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
    alerts: *alerts

# Checks Gatus can't run itself, because they read response headers or compare
# dates. bin/push/checks.sh runs them every 10 minutes from cron on this server
# and reports each result here. The heartbeat marks a check as failed when no
# result came in for 30 minutes, i.e. when the script stopped running.
#
# The script finds an endpoint by its key, `<group>_<name>` in lower case with
# spaces replaced by `-`. Renaming one here means changing the key there.
#
# GATUS_PUSH_TOKEN is generated into .env by bin/setup.sh and bin/update.sh.
external-endpoints:
  - name: Vector tile content type
    group: Tiles
    token: ${GATUS_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts: *alerts

  # Not an outage, but nobody would notice for months: a planet older than 180
  # days means the release pipeline has stalled. Releases so far came every
  # 2 to 5 months.
  - name: Planet release
    group: Download
    token: ${GATUS_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts: *alerts

  # The tile server serves the newest planet, at the latest 7 days after its
  # release. tiles.versatiles.org only updates when bin/update.sh runs there.
  - name: Newest planet served
    group: Tiles
    token: ${GATUS_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts: *alerts

  - name: Satellite tile content type
    group: Satellite
    token: ${GATUS_PUSH_TOKEN}
    heartbeat:
      interval: 30m
    alerts: *alerts
